<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초과근무 관리자</title>
<link rel="stylesheet" href="overtime-admin.css">
</head>

<body>
<div class="wrap">

  <div class="header">
    <h1>초과근무 관리자</h1>
    <p>초과근무 내역 조회, 승인, 반려, 삭제를 관리합니다.</p>
  </div>

  <div class="search-card">
    <div>
      <label>시작일</label>
      <input type="date" id="startDate">
    </div>

    <div>
      <label>종료일</label>
      <input type="date" id="endDate">
    </div>

    <div>
      <label>직원명</label>
      <input type="text" id="employeeName" placeholder="직원명 검색">
    </div>

    <div>
      <label>상태</label>
      <select id="statusFilter">
        <option value="">전체</option>
        <option value="등록">등록</option>
        <option value="승인">승인</option>
        <option value="반려">반려</option>
        <option value="수정">수정</option>
      </select>
    </div>

    <button onclick="loadList()">
     조회
    </button>

    <button class="bulk-btn" onclick="approveAllPending()">
  전체 승인
</button>

<button class="bulk-btn" onclick="loadMonthlyReport()">
  월별집계
</button>

<button class="bulk-btn" onclick="exportMonthlyExcel()">
  엑셀출력
</button>

   </div>

  <div class="summary">
    <div>전체 <strong id="totalCount">0</strong>건</div>
    <div>등록 <strong id="pendingCount">0</strong>건</div>
    <div>승인 <strong id="approvedCount">0</strong>건</div>
    <div>반려 <strong id="rejectedCount">0</strong>건</div>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>근무일자</th>
          <th>직원명</th>
          <th>구분</th>
          <th>시간</th>
          <th>사유</th>
          <th>비고</th>
          <th>입력자</th>
          <th>상태</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="table-card" id="monthlyBox">

  <div class="monthly-head">
    <h3 id="monthlyTitle">월별 초과근무 일지</h3>

    <div>
      <button onclick="loadMonthlyReport()" class="month-btn">
        월별일지 생성
      </button>

      <button onclick="exportMonthlyExcel()" class="month-btn excel">
        엑셀출력
      </button>
    </div>
  </div>

  <div class="monthly-scroll">
    <table id="monthlyTable">
      <thead id="monthlyThead"></thead>
      <tbody id="monthlyTbody"></tbody>
      <tfoot id="monthlyTfoot"></tfoot>
    </table>
  </div>

</div>



</div>

<script src="overtime-admin.js"></script>
</body>
</html>
