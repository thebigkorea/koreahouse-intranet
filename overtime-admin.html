<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초과근무 관리자</title>
<link rel="stylesheet" href="overtime-admin.css">
</head>

<body>
<div class="wrap">

  <div class="header">
    <h1>초과근무 관리자</h1>
    <p>초과근무 내역 조회, 승인, 반려, 삭제를 관리합니다.</p>
  </div>

  <div class="search-card">

  <div>
    <label>조회월</label>
    <input type="month" id="searchMonth">
  </div>

  <div>
    <label>직원명</label>
    <input
      type="text"
      id="employeeName"
      placeholder="직원명 검색">
  </div>

  <div>
    <label>상태</label>
    <select id="statusFilter">
      <option value="">전체</option>
      <option value="등록">등록</option>
      <option value="승인">승인</option>
      <option value="반려">반려</option>
      <option value="수정">수정</option>
    </select>
  </div>

  <button onclick="loadList()">
    조회
  </button>

  <button
    class="bulk-btn"
    onclick="approveAllPending()">
    전체 승인
  </button>

  <button
    class="bulk-btn"
    onclick="loadMonthlyReport()">
    월별집계
  </button>

  <button
    class="bulk-btn"
    onclick="exportMonthlyExcel()">
    엑셀출력
  </button>

</div>

    

  <div class="summary">
    <div>전체 <strong id="totalCount">0</strong>건</div>
    <div>등록 <strong id="pendingCount">0</strong>건</div>
    <div>승인 <strong id="approvedCount">0</strong>건</div>
    <div>반려 <strong id="rejectedCount">0</strong>건</div>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>근무일자</th>
          <th>직원명</th>
          <th>구분</th>
          <th>시간</th>
          <th>사유</th>
          <th>비고</th>
          <th>입력자</th>
          <th>상태</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- 직원별 월간 초과근무 요약 -->
<div
  class="employee-monthly-card"
  id="employeeMonthlyBox">

  <div class="employee-monthly-head">

    <div>
      <h3 id="employeeMonthlyTitle">
        직원별 월간 초과근무 요약
      </h3>

      <p>
        승인된 초과근무 내역을 직원별로 집계합니다.
      </p>
    </div>

  </div>

  <div class="employee-monthly-scroll">

    <table class="employee-monthly-table">

      <thead>
        <tr>
          <th>직원명</th>
          <th>초과근무</th>
          <th>미휴게</th>
          <th>휴무근무</th>
          <th>연차미사용</th>
          <th>조퇴</th>
          <th>인정합계</th>
          <th>건수</th>
          <th>관리</th>
        </tr>
      </thead>

      <tbody id="employeeMonthlyTbody">

        <tr>
          <td colspan="9" class="empty">
            조회월을 선택하고 월별집계를 눌러주세요.
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>

  <div class="table-card" id="monthlyBox">

  <div class="monthly-head">
    <h3 id="monthlyTitle">월별 초과근무 일지</h3>

    <div>
      <button onclick="loadMonthlyReport()" class="month-btn">
        월별일지 생성
      </button>

      <button onclick="exportMonthlyExcel()" class="month-btn excel">
        엑셀출력
      </button>
    </div>
  </div>

  <div class="monthly-scroll">
    <table id="monthlyTable">
      <thead id="monthlyThead"></thead>
      <tbody id="monthlyTbody"></tbody>
      <tfoot id="monthlyTfoot"></tfoot>
    </table>
  </div>

</div>



</div>

<!-- 직원별 상세보기 -->
<div
  id="employeeDetailModalBg"
  class="overtime-modal-bg"
  onclick="closeEmployeeDetailByBg(event)">

  <div class="overtime-modal">

    <div class="overtime-modal-head">

      <div>
        <h3 id="employeeDetailTitle">
          직원별 초과근무 내역
        </h3>

        <p>
          승인된 내역을 기준으로 표시합니다.
        </p>
      </div>

      <button
        type="button"
        class="modal-close-btn"
        onclick="closeEmployeeDetailModal()">
        ✕
      </button>

    </div>

    <div
      id="employeeDetailContent"
      class="employee-detail-content">
    </div>

    <div class="overtime-modal-actions">

      <button
        type="button"
        class="kakao-image-btn"
        onclick="makeCurrentEmployeeKakaoImage()">
        카톡 이미지 만들기
      </button>

      <button
        type="button"
        class="modal-cancel-btn"
        onclick="closeEmployeeDetailModal()">
        닫기
      </button>

    </div>

  </div>

</div>


<!-- 카톡 이미지 미리보기 -->
<div
  id="overtimeKakaoModalBg"
  class="overtime-modal-bg"
  onclick="closeOvertimeKakaoByBg(event)">

  <div class="overtime-modal kakao-preview-modal">

    <div class="overtime-modal-head">

      <div>
        <h3>카톡용 초과근무 이미지</h3>

        <p>
          이미지를 복사한 후 카카오톡에 붙여넣으세요.
        </p>
      </div>

      <button
        type="button"
        class="modal-close-btn"
        onclick="closeOvertimeKakaoModal()">
        ✕
      </button>

    </div>

    <div class="overtime-kakao-preview">

      <img
        id="overtimeKakaoPreviewImage"
        alt="초과근무 이미지 미리보기">

    </div>

    <div class="overtime-modal-actions">

      <button
        type="button"
        class="kakao-copy-btn"
        onclick="copyOvertimeKakaoImage()">
        이미지 복사
      </button>

      <button
        type="button"
        class="kakao-save-btn"
        onclick="downloadOvertimeKakaoImage()">
        PNG 저장
      </button>

      <button
        type="button"
        class="modal-cancel-btn"
        onclick="closeOvertimeKakaoModal()">
        닫기
      </button>

    </div>

  </div>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
</script>

<script src="overtime-admin.js"></script>

</body>
</html>
