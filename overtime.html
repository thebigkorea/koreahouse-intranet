<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>초과근무관리</title>

<link rel="stylesheet" href="overtime.css">
</head>

<body>

<div class="wrap">

  <div class="header">
    <h1>초과근무관리</h1>
    <p>
      초과근무, 미휴게, 특근 내역을 등록합니다.
    </p>
  </div>

  <div class="card">

    <div class="grid">

      <div>
        <label>근무일자</label>
        <input type="date" id="workDate">
      </div>

      <div>
        <label>직원명</label>
        <input type="text" id="employeeName">
      </div>

      <div>
        <label>구분</label>
        <select id="type">
          <option>초과근무</option>
          <option>미휴게</option>
          <option>특근</option>
          <option>휴무근무</option>
          <option>조퇴</option>
          <option>기타</option>
        </select>
      </div>

      <div>
        <label>시간</label>
        <select id="hours">
          <option value="0.5">0.5</option>
          <option value="1">1</option>
          <option value="1.5">1.5</option>
          <option value="2">2</option>
          <option value="2.5">2.5</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>

    </div>

    <label>사유</label>
    <textarea id="reason"></textarea>

    <label>비고</label>
    <textarea id="memo"></textarea>

    <button
      class="save-btn"
      onclick="saveOvertime()">
      저장
    </button>

  </div>

  <div class="list-card">

    <h2>최근 등록내역</h2>

    <table>

      <thead>
        <tr>
          <th>근무일자</th>
          <th>직원명</th>
          <th>구분</th>
          <th>시간</th>
          <th>사유</th>
        </tr>
      </thead>

      <tbody id="tbody"></tbody>

    </table>

  </div>

</div>

<script src="overtime.js"></script>

</body>
</html>
