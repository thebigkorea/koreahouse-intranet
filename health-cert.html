<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보건증 관리</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  background:#f8f3ea;
  font-family:"Noto Sans KR",sans-serif;
  color:#3b2414;
  overflow-x:hidden;
}

.wrap{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding:60px 24px;
}

h1{
  font-size:42px;
  margin:0 0 32px;
}

.retire-btn{
  background:#b91c1c;
  margin-left:6px;
}

.card{
  background:white;
  border-radius:24px;
  padding:24px;
  margin-bottom:24px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

input,button{
  width:100%;
  height:52px;
  border-radius:12px;
  border:1px solid #ddd;
  padding:0 14px;
  font-size:16px;
}

button{
  width:auto;
  min-width:70px;
  background:#8a5a2b;
  color:white;
  font-weight:800;
  cursor:pointer;
  border:none;
}

.btn-row{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.cancel-btn{
  background:#777;
  display:none;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#3b2414;
  color:white;
  padding:14px;
  white-space:nowrap;
}

td{
  padding:13px;
  border-bottom:1px solid #eee;
  text-align:center;
  white-space:nowrap;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  font-weight:800;
  font-size:14px;
}

.normal{background:#dcfce7;color:#166534;}
.warn{background:#fff3cd;color:#8a5a00;}
.danger{background:#fed7aa;color:#c2410c;}
.expired{background:#fee2e2;color:#b91c1c;}

.edit-btn{
  height:36px;
  min-width:60px;
  font-size:14px;
  border-radius:10px;
}

.empty{
  padding:30px;
  text-align:center;
  color:#777;
}

@media (max-width:600px){
  .wrap{padding:28px 16px;}
  h1{font-size:30px;}
  .card{padding:18px;}
  .grid{grid-template-columns:1fr;}
  .btn-row{flex-direction:column;}
  button{width:100%;}
  table{min-width:720px;}
}
</style>
</head>

<body>
<div class="wrap">

  <h1>보건증 관리</h1>

  <div class="card">
    <div class="grid">
      <input id="name" placeholder="직원명">
      <input id="store" placeholder="소속" value="한국의집 롯데월드몰점">
      <input id="phone" placeholder="연락처">
      <input id="expireDate" type="date">
    </div>

    <div class="btn-row">
      <button id="saveBtn" onclick="saveHealthCert()">저장</button>
      <button id="cancelBtn" class="cancel-btn" onclick="cancelEdit()">수정취소</button>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>직원명</th>
            <th>소속</th>
            <th>연락처</th>
            <th>보건증 만료일</th>
            <th>상태</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycby-FdNL_GsXFB4klTrk8fM6YB7Fgkoh0-we-D48z9o34d0OUy09PtHuAaCIAfngIqs7/exec";

let currentList = [];
let editName = "";

document.addEventListener("DOMContentLoaded", loadHealthCertList);

async function saveHealthCert(){

  const data = {
    action: editName ? "update" : "save",
    oldName: editName,
    name: val("name"),
    store: val("store"),
    phone: val("phone"),
    expireDate: val("expireDate")
  };

  if(!data.name || !data.expireDate){
    alert("직원명과 만료일은 필수입니다.");
    return;
  }

  try{
    const res = await fetch(API_URL,{
      method:"POST",
      body:JSON.stringify(data)
    });

    const result = await res.json();

    if(result.success){
      alert(editName ? "수정되었습니다." : "저장되었습니다.");
      clearForm();
      loadHealthCertList();
    }else{
      alert(result.message || "저장 실패");
    }

  }catch(err){
    alert("저장 중 오류가 발생했습니다.");
  }
}


async function retireHealthCert(index){

  const item = currentList[index];
  if(!item) return;

  if(!confirm(`${item.name} 직원을 퇴사 처리할까요?`)){
    return;
  }

  try{
    const res = await fetch(API_URL,{
      method:"POST",
      body:JSON.stringify({
        action:"retire",
        name:item.name
      })
    });

    const result = await res.json();

    if(result.success){
      alert("퇴사 처리되었습니다.");
      loadHealthCertList();
    }else{
      alert(result.message || "퇴사 처리 실패");
    }

  }catch(err){
    alert("퇴사 처리 중 오류가 발생했습니다.");
  }
}

async function loadHealthCertList(){

  const body = document.getElementById("listBody");

  body.innerHTML = `
    <tr>
      <td colspan="6" class="empty">불러오는 중입니다.</td>
    </tr>
  `;

  try{
    const res = await fetch(API_URL,{
      method:"POST",
      body:JSON.stringify({action:"list"})
    });

    const result = await res.json();
const list = result.list || [];

/* 만료일 가까운 순서로 정렬 */
list.sort((a, b) => {

  const aDiff = getDiffDays(a.expireDate);
  const bDiff = getDiffDays(b.expireDate);

  const priority = diff => {
    if(diff < 0) return 0;      // 만료
    if(diff <= 7) return 1;     // 즉시갱신
    if(diff <= 30) return 2;    // 갱신임박
    return 3;                   // 정상
  };

  const pa = priority(aDiff);
  const pb = priority(bDiff);

  if(pa !== pb) return pa - pb;

  return aDiff - bDiff;

});

currentList = list;
body.innerHTML = "";

    if(list.length === 0){
      body.innerHTML = `
        <tr>
          <td colspan="6" class="empty">등록된 보건증이 없습니다.</td>
        </tr>
      `;
      return;
    }

    list.forEach((item,index)=>{
      body.innerHTML += `
        <tr>
          <td>${item.name || ""}</td>
          <td>${item.store || ""}</td>
          <td>${item.phone || ""}</td>
          <td>${item.expireDate || ""}</td>
          <td>${makeStatusBadge(item.expireDate)}</td>
          <td>
            <button class="edit-btn" onclick="editHealthCert(${index})">수정</button>
            <button class="edit-btn retire-btn" onclick="retireHealthCert(${index})">퇴사</button>
          </td>
        </tr>
      `;
    });

  }catch(err){
    body.innerHTML = `
      <tr>
        <td colspan="6" class="empty">자료를 불러오지 못했습니다.</td>
      </tr>
    `;
  }
}

function editHealthCert(index){

  const item = currentList[index];
  if(!item) return;

  editName = item.name || "";

  document.getElementById("name").value = item.name || "";
  document.getElementById("store").value = item.store || "";
  document.getElementById("phone").value = item.phone || "";
  document.getElementById("expireDate").value = item.expireDate || "";

  document.getElementById("saveBtn").textContent = "수정저장";
  document.getElementById("cancelBtn").style.display = "inline-block";

  window.scrollTo({top:0, behavior:"smooth"});
}

function cancelEdit(){
  clearForm();
}

function clearForm(){
  editName = "";
  document.getElementById("name").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("expireDate").value = "";
  document.getElementById("store").value = "한국의집 롯데월드몰점";
  document.getElementById("saveBtn").textContent = "저장";
  document.getElementById("cancelBtn").style.display = "none";
}

function makeStatusBadge(date){

  const diff = getDiffDays(date);

  if(diff < 0) return `<span class="badge expired">만료</span>`;
  if(diff <= 7) return `<span class="badge danger">즉시갱신</span>`;
  if(diff <= 30) return `<span class="badge warn">갱신임박</span>`;

  return `<span class="badge normal">정상</span>`;
}

function getDiffDays(date){

  const today = new Date();
  today.setHours(0,0,0,0);

  const end = new Date(date);
  end.setHours(0,0,0,0);

  return Math.floor((end - today) / (1000*60*60*24));
}

function val(id){
  return document.getElementById(id).value.trim();
}
</script>

</body>
</html>
